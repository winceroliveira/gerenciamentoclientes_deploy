# Stack ProgPlay — Portainer
# SQLite: volume progplay-sqlite-data (dentro do container api)
# Gateway: imagem propria (configs: quebrava ports no Portainer)

services:
  api:
    image: ghcr.io/winceroliveira/gerenciamentoclientes_back:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/app.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - progplay_sqlite:/data
    networks:
      - progplay
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ghcr.io/winceroliveira/gerenciamentoclientes_front:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - progplay

  gateway:
    image: ghcr.io/winceroliveira/gerenciamentoclientes_deploy-gateway:latest
    restart: unless-stopped
    ports:
      - target: 80
        published: 8080
        protocol: tcp
    depends_on:
      - api
      - web
    networks:
      - progplay

networks:
  progplay:
    name: progplay-gerenciamento

volumes:
  progplay_sqlite:
    name: progplay-sqlite-data
