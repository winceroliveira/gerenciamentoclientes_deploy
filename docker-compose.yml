# Stack ProgPlay — Portainer
# SQLite: volume "progplay-sqlite-data" (arquivo /data/app.db dentro do container api)
# api/web NÃO expõem porta no host — só gateway :8080

services:
  api:
    image: ghcr.io/winceroliveira/gerenciamentoclientes_back:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/app.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - progplay_sqlite:/data
    networks:
      - progplay
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ghcr.io/winceroliveira/gerenciamentoclientes_front:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - progplay

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    configs:
      - source: nginx_gateway_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - web
    networks:
      - progplay

networks:
  progplay:
    name: progplay-gerenciamento

volumes:
  progplay_sqlite:
    name: progplay-sqlite-data

configs:
  nginx_gateway_conf:
    content: |
      server {
          listen 80;
          server_name _;
          client_max_body_size 10m;

          location /health {
              proxy_pass http://api:3000/health;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /api {
              proxy_pass http://api:3000/api;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /webhooks {
              proxy_pass http://api:3000/webhooks;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location / {
              proxy_pass http://web:80;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
