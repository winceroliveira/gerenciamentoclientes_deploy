# Stack única — ProgPlay Gerenciamento de Clientes
# Imagens publicadas pelo GitHub Actions (GHCR).
# Portainer: 1 stack apontando para ESTE repositório (não uma stack por repo).

name: progplay-gerenciamento

services:
  api:
    container_name: progplay-api
    image: ghcr.io/winceroliveira/gerenciamentoclientes_back:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/app.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - progplay_sqlite:/data
    networks:
      - progplay
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    container_name: progplay-web
    image: ghcr.io/winceroliveira/gerenciamentoclientes_front:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - progplay

  gateway:
    container_name: progplay-gateway
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - progplay

networks:
  progplay:
    name: progplay-gerenciamento

volumes:
  progplay_sqlite:
    name: progplay-sqlite-data
