name: Publish gateway image

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/publish-gateway.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-gateway:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-gateway:${{ github.sha }}
